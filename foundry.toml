[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
  '@chainlink/contracts-ccip/=lib/ccip/contracts/',
  '@chainlink/local/=lib/chainlink-local/',
  # Test-only: point Client at chainlink-local's bundled CCIP 1.6 so the local-sim test
  # uses the SAME Client types as the simulator's router (avoids 1.5/1.6 type mismatch).
  '@ccip-local-contracts/=lib/chainlink-local/lib/chainlink-ccip/chains/evm/contracts/',
  # Context remappings so chainlink-local's own files resolve its bundled deps (the skill omits these).
  'lib/chainlink-local/:@chainlink/contracts-ccip/=lib/chainlink-local/lib/chainlink-ccip/chains/evm/',
  'lib/chainlink-local/:@chainlink/contracts/=lib/chainlink-local/lib/chainlink-evm/contracts/',
  'lib/chainlink-local/:@openzeppelin/contracts@4.8.3/=lib/chainlink-local/src/vendor/openzeppelin-solidity/v4.8.3/contracts/',
  'lib/chainlink-local/:@openzeppelin/contracts@5.0.2/=lib/chainlink-local/src/vendor/openzeppelin-solidity/v5.0.2/contracts/'
]

fs_permissions = [{ access = "read-write", path = "./" }]

[etherscan]
avalanche-fuji = { key = "${ETHERSCAN_API_KEY}", chain = 43113, url = "https://api-testnet.snowtrace.io/api" }
arbitrum-sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421613, url = "https://api-sepolia.arbiscan.io/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
